[project]
name = "tensordir"
version = "0.1.0"
description = "Content-addressed records of labeled tensors in directories: build once from a spec, reopen anywhere."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Janne K. Lappalainen", email = "lappalainenj@users.noreply.github.com" }
]
keywords = ["zarr", "xarray", "caching", "provenance", "reproducibility", "hpc", "jaxtyping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "zarr>=3.0",
]

[project.optional-dependencies]
xarray = [
    "xarray>=2024.10",
]
memory = [
    "joblib>=1.4,<1.6",
]
tables = [
    "pandas>=2.1",
    "pyarrow>=15",
]
typing = [
    "jaxtyping>=0.2.36",
]
legacy = [
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "pyyaml>=6",
]
torch = [
    "safetensors>=0.4",
]
delta = [
    "deltalake>=0.18",
    "pyarrow>=15",
]
hdf5 = [
    "h5py>=3.10",
]
all = ["tensordir[xarray,memory,tables,typing,legacy,torch,delta,hdf5]"]

[project.scripts]
tensordir = "tensordir.cli:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "hypothesis>=6.169.3",
    "imageio>=2.38.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]
docs = [
    "duckdb>=1.1",
    "ipykernel>=6.29",
    "mkdocs>=1.6,<2",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "tensordir[all]",
]
torch = [
    "torch>=2.4",
]
